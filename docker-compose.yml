services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vigiagov
      POSTGRES_PASSWORD: vigiagov
      POSTGRES_DB: vigiagov
    ports:
      - "5432:5432"
    volumes:
      - vigiagov_postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - postgres

volumes:
  vigiagov_postgres_data:
